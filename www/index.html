<html lang="th">

<meta name="application-name" content="Pipe Calculator">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-display:swap;font-weight:400;src:url(fonts/ibm-plex-sans-thai-thai-400-normal.woff2) format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}

@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-display:swap;font-weight:500;src:url(fonts/ibm-plex-sans-thai-thai-500-normal.woff2) format('woff2');unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}

@font-face{font-family:'IBM Plex Sans Thai';font-style:normal;font-display:swap;font-weight:600;src:url(fonts/ibm-plex-sans-thai-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:'IBM Plex Mono';font-style:normal;font-display:swap;font-weight:500;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* Layout: แถบหัวสีน้ำเงินเข้ม (โลโก้ + ชื่อ) แล้วแผงอินพุตซ้าย ผลลัพธ์ขวา โทนขรึม ใช้สีสดเฉพาะสถานะและขนาดท่อที่แนะนำ */
:root {
  --bg: #E9EDF0;
  --surface: #FFFFFF;
  --soft: #E1E7EB;
  --ink: #17232D;
  --muted: #5A6B77;
  --line: #D3DAE0;
  --hero: #14293B; --hero-fg: #F2F6F8; --hero-muted: #A9BAC6;
  --closed: #1E5E7C;
  --open: #8A5A2B;
  --on: #FFFFFF;
  --ok: #1F6B45; --ok-bg: #E1EFE7;
  --warn: #8A5B00; --warn-bg: #F6EBD2;
  --bad: #A3322B; --bad-bg: #F6E1DE;
  --font-ui: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1820; --surface: #15232D; --soft: #1C2E3A; --ink: #E3EAEE; --muted: #92A4B0; --line: #2A3E4B;
    --hero: #0A121A; --hero-fg: #EEF3F6; --hero-muted: #8FA3B0;
    --closed: #6FB4D3; --open: #D6A06A; --on: #0E1820;
    --ok: #66C28E; --ok-bg: #17362A; --warn: #E0B458; --warn-bg: #372C14; --bad: #F0928A; --bad-bg: #3F2220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1820; --surface: #15232D; --soft: #1C2E3A; --ink: #E3EAEE; --muted: #92A4B0; --line: #2A3E4B;
  --hero: #0A121A; --hero-fg: #EEF3F6; --hero-muted: #8FA3B0;
  --closed: #6FB4D3; --open: #D6A06A; --on: #0E1820;
  --ok: #66C28E; --ok-bg: #17362A; --warn: #E0B458; --warn-bg: #372C14; --bad: #F0928A; --bad-bg: #3F2220;
  color-scheme: dark;
}
:root { scrollbar-gutter: stable; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-ui); padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#root { --accent: var(--closed); max-width: 1180px; margin: 0 auto; }
#root[data-loop="open"] { --accent: var(--open); }
#root[data-lang="th"] .en, #root[data-lang="en"] .th { display: none; }
#root[data-loop="closed"] .ol, #root[data-loop="open"] .cl { display: none; }
* { box-sizing: border-box; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
h1 { font-size: 24px; letter-spacing: -0.01em; }
h2 { font-size: 16px; }
h3 { font-size: 14px; margin-top: 16px; }
a { color: var(--accent); }

.hero { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; background: var(--hero); color: var(--hero-fg); border-radius: 12px; padding: 14px 18px; }
.brand { display: flex; align-items: center; gap: 14px; flex: 1 1 320px; min-width: 0; }
.brand > div { min-width: 0; }
.logo { width: 60px; height: 60px; flex: none; display: block; }
.hero h1 { font-size: 26px; letter-spacing: -0.01em; line-height: 1.2; }
#subtitle { margin: 2px 0 0; color: var(--hero-muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 760px) { #subtitle { white-space: normal; min-height: 2.8em; } }
.ctrl { display: flex; gap: 10px; align-items: stretch; flex: 0 0 auto; }
.seg { display: flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { font: 500 13px var(--font-num); border: 0; background: transparent; color: var(--muted); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.hero .seg { background: rgba(255, 255, 255, .10); }
.hero .seg button { color: var(--hero-muted); }
.hero .seg button[aria-pressed="true"] { background: var(--hero-fg); color: var(--hero); box-shadow: none; }
.modebar { margin: 16px 0 18px; }
.tabs { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 3px; }
.tabs button { font: 600 14px var(--font-ui); border: 0; background: transparent; color: var(--muted); padding: 9px 24px; border-radius: 8px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } }
.panel, .block { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.panel { padding: 18px; display: grid; gap: 20px; }
@media (min-width: 901px) { .panel { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; } }
.results { display: grid; gap: 18px; min-width: 0; }
.block { padding: 18px; min-width: 0; }
.block > h2 { margin-bottom: 4px; }
.block > .hint { margin: 0 0 12px; color: var(--muted); font-size: 13px; }

fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; min-width: 0; }
legend { font-size: 14px; color: var(--ink); font-weight: 600; padding: 0 0 8px; margin-bottom: 4px; width: 100%; border-bottom: 1px solid var(--line); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; align-content: start; }
.f > span:first-child { line-height: 1.3; }
input, select { font: 15px var(--font-num); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-height: 42px; width: 100%; min-width: 0; }
select { font-family: var(--font-ui); }
input[type=number] { appearance: textfield; -moz-appearance: textfield; }
.inline { display: grid; grid-template-columns: minmax(0, 1fr) 118px; gap: 8px; }
.ro { font: 13px var(--font-num); color: var(--muted); }
.ro b { color: var(--ink); font-weight: 500; }
details.crit { border-top: 1px solid var(--line); padding-top: 12px; }
details > summary { cursor: pointer; font-size: 13px; font-weight: 500; }
details[open] > summary { margin-bottom: 10px; }
.tier { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mini { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.kpi { padding: 16px 18px; display: grid; gap: 3px; align-content: start; min-width: 0; }
.kpi + .kpi { border-left: 1px solid var(--line); }
@media (max-width: 760px) { .kpi + .kpi { border-left: 0; border-top: 1px solid var(--line); } }
.lbl { font-size: 12px; color: var(--muted); letter-spacing: .03em; }
.big { font: 600 30px/1.15 var(--font-ui); font-variant-numeric: tabular-nums; color: var(--ink); }
.kpi.rec .big { color: var(--accent); }
.big i { font-style: normal; font-size: 15px; color: var(--muted); margin-left: 4px; }
.sm { font: 13px var(--font-num); color: var(--ink); overflow-wrap: anywhere; }
.sm.m { color: var(--muted); }
.alert { padding: 10px 12px; border-radius: 8px; font-size: 13px; background: var(--warn-bg); color: var(--warn); margin-top: 12px; }
.alert.bad { background: var(--bad-bg); color: var(--bad); }

.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font: 13px var(--font-num); font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font: 500 12px var(--font-ui); color: var(--muted); background: var(--soft); position: sticky; top: 0; }
th:first-child, td:first-child { text-align: left; }
th:last-child, td:last-child { text-align: left; }
tr:last-child td { border-bottom: 0; }
tr.rec td, tr.cur td { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
tr.rec td { font-weight: 500; }
td.bad { color: var(--bad); } td.warn { color: var(--warn); } td.dim { color: var(--muted); }
table.guide td { white-space: normal; text-align: left; font: 13px var(--font-ui); vertical-align: top; }
table.guide td.v { font: 13px var(--font-num); white-space: nowrap; }
table.guide th { text-align: left; }
.pill { display: inline-block; font: 500 12px var(--font-ui); padding: 1px 9px; border-radius: 99px; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.near { background: var(--warn-bg); color: var(--warn); }
.pill.over { background: var(--bad-bg); color: var(--bad); }
.pill.low { background: var(--soft); color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--muted); }
.tools label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.tools input { width: auto; }
.btn { font: 500 13px var(--font-ui); background: var(--accent); color: var(--on); border: 0; border-radius: 7px; padding: 8px 14px; cursor: pointer; }

.chart { overflow-x: auto; margin-top: 4px; }
.chart svg { display: block; min-width: 560px; width: 100%; height: auto; }
.chart.big svg { min-width: 760px; }
.g-line { stroke: var(--line); stroke-width: 1; }
.g-minor { stroke: var(--line); stroke-width: .5; opacity: .6; }
.g-band { fill: var(--accent); fill-opacity: .10; }
.g-lim { stroke: var(--bad); stroke-width: 1.2; stroke-dasharray: 5 4; }
.g-path { fill: none; stroke: var(--accent); stroke-width: 2; }
.g-pipe { fill: none; stroke: var(--muted); stroke-width: 1.2; opacity: .75; }
.g-pipe.sel { stroke: var(--accent); stroke-width: 2.6; opacity: 1; }
.g-vel { fill: none; stroke: var(--open); stroke-width: 1; stroke-dasharray: 3 4; opacity: .8; }
:root[data-theme="dark"] .g-vel { stroke: var(--open); }
.g-cross { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 2 3; }
.g-t { fill: var(--muted); font: 11px var(--font-num); }
.g-t.b { fill: var(--ink); font-weight: 500; }
.g-t.bad { fill: var(--bad); }
.g-t.vel { fill: var(--open); }
.g-t.acc { fill: var(--accent); font-weight: 500; }
.g-t.ttl { font: 500 12px var(--font-ui); fill: var(--ink); }
.s-ok { fill: var(--ok); } .s-near { fill: var(--warn); } .s-over { fill: var(--bad); } .s-low { fill: var(--muted); }
.g-ring { fill: none; stroke: var(--accent); stroke-width: 2; }
.g-dot { fill: var(--accent); }

.fits { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--soft); margin: 12px 0 8px; }
.stack span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.c1 { background: var(--accent); } .c2 { background: color-mix(in srgb, var(--accent) 60%, var(--surface)); }
.c3 { background: color-mix(in srgb, var(--accent) 35%, var(--surface)); } .c4 { background: var(--muted); } .c5 { background: var(--line); }
.phead { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 20px; margin: 14px 0 4px; }
.phead > div { display: grid; gap: 2px; }
.phead .big { font-size: 24px; }
.notes { font-size: 13px; color: var(--muted); }
.notes ul, .refs ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 5px; }
.notes b { color: var(--ink); font-weight: 500; }
.refs { font-size: 13px; color: var(--muted); }
.refs li b { color: var(--ink); font-weight: 500; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

.seg button.flag { padding: 5px 7px; line-height: 0; }
.seg button.flag svg { width: 28px; height: 18px; border-radius: 2px; display: block; box-shadow: 0 0 0 1px var(--line); }
.seg button.flag[aria-pressed="false"] { opacity: .5; }
.seg.pick { display: flex; flex-wrap: wrap; }
.seg.pick button { flex: 1 1 auto; text-align: center; line-height: 1.25; padding: 10px 10px; font-size: 14px; }
.seg.pick#known button { font-family: var(--font-ui); }
.seg.pick button[aria-pressed="true"] { background: var(--accent); color: var(--on); box-shadow: none; }
.zoomwrap { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); touch-action: pan-y; }
.zoomwrap.zoomed { touch-action: none; cursor: grab; }
.zoomwrap.zoomed:active { cursor: grabbing; }
.zoomwrap svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.zoomctl { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
.zoomctl button { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 7px; font: 500 17px var(--font-num); cursor: pointer; padding: 0; }
.zoomctl button:hover { border-color: var(--accent); color: var(--accent); }
.zoomlvl { position: absolute; left: 10px; bottom: 8px; font: 12px var(--font-num); color: var(--muted); pointer-events: none; }

.dock { display: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.dock .go { text-align: right; }
.dock:focus-visible { outline: 2px solid var(--hero-fg); outline-offset: -4px; }
.dock div { display: grid; gap: 1px; }
.dock b { font: 600 20px var(--font-ui); font-variant-numeric: tabular-nums; }
.dock span { font-size: 12px; color: var(--hero-muted); }
@media (max-width: 900px) {
  .dock:not(:empty) { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; gap: 18px; justify-content: space-between; align-items: flex-end; background: var(--hero); color: var(--hero-fg);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -6px 16px rgba(0, 0, 0, .2); }
  body { padding-bottom: 90px; }
}

</style>
</head>
<body>
<div id="root" data-loop="closed" data-lang="th">

    dn, tier: dn, label: 'DN' + dn, alt: INCH[i], od: CU_OD[i], id: +(CU_OD[i] - 2 * CU_W[i]).toFixed(2)
  }));

  // HDPE PE100 PN10 (SDR17) ผนัง = OD/17 ปัดตามตาราง ISO 4427 (ขั้นต่ำ 2.0 มม.)
  const HD_OD = [32, 40, 50, 63, 75, 90, 110, 125, 140, 160, 180, 200, 225, 250, 280, 315, 355, 400, 450, 500, 560, 630];
  const HD_W = [2.0, 2.4, 3.0, 3.8, 4.5, 5.4, 6.6, 7.4, 8.3, 9.5, 10.7, 11.9, 13.4, 14.8, 16.6, 18.7, 21.1, 23.7, 26.7, 29.7, 33.2, 37.4];
  // ท่อพลาสติกขายตาม OD: map เป็น DN ประมาณเพื่อใช้เทียบเกณฑ์ความเร็วตามขนาด
  const tierOfOD = (od) => (od <= 63 ? 50 : od <= 110 ? 100 : od <= 225 ? 200 : 250);
  const hdpeRows = HD_OD.map((od, i) => ({
    dn: od, tier: tierOfOD(od), label: 'OD' + od, alt: 'SDR17', od, id: +(od - 2 * HD_W[i]).toFixed(1)
  }));

  // PPR (ISO 15874 / DIN 8077): PN10 = SDR11, PN20 = SDR6 ความหนาผนังตามตารางผู้ผลิตทั่วไป
  const PPR_OD = [20, 25, 32, 40, 50, 63, 75, 90, 110, 125, 160];
  const PPR_DN = [15, 20, 25, 32, 40, 50, 65, 80, 100, 125, 150];
  const PPR_W10 = [1.9, 2.3, 2.9, 3.7, 4.6, 5.8, 6.8, 8.2, 10.0, 11.4, 14.6];
  const PPR_W20 = [3.4, 4.2, 5.4, 6.7, 8.3, 10.5, 12.5, 15.0, 18.3, 20.8, 26.6];
  const pprRows = (W) => PPR_OD.map((od, i) => ({
    dn: PPR_DN[i], tier: PPR_DN[i], label: 'OD' + od, alt: 'DN' + PPR_DN[i], od, id: +(od - 2 * W[i]).toFixed(1)
  }));

  // เรียงตามความนิยมใช้: main = ชนิดท่อที่ใช้หลัก
  const PIPES = {
    steel40: { main: true, name: { th: 'เหล็กดำ/ชุบสังกะสี Sch 40', en: 'Steel Sch 40 (ASTM A53)' }, short: { th: 'เหล็ก Sch 40', en: 'Steel Sch 40' }, eps: { closed: 0.045, open: 0.15 }, rows: steelRows(W40) },
    steel80: { main: true, name: { th: 'เหล็ก Sch 80', en: 'Steel Sch 80' }, short: { th: 'เหล็ก Sch 80', en: 'Steel Sch 80' }, eps: { closed: 0.045, open: 0.15 }, rows: steelRows(W80) },
    ppr20: { main: true, name: { th: 'PPR PN20 (SDR6)', en: 'PPR PN20 (SDR6)' }, short: { th: 'PPR PN20', en: 'PPR PN20' }, eps: { closed: 0.007, open: 0.007 }, rows: pprRows(PPR_W20) },
    ppr10: { main: true, name: { th: 'PPR PN10 (SDR11)', en: 'PPR PN10 (SDR11)' }, short: { th: 'PPR PN10', en: 'PPR PN10' }, eps: { closed: 0.007, open: 0.007 }, rows: pprRows(PPR_W10) },
    copperL: { main: false, name: { th: 'ทองแดง Type L', en: 'Copper Type L (ASTM B88)' }, short: { th: 'ทองแดง L', en: 'Copper L' }, eps: { closed: 0.0015, open: 0.0015 }, rows: copperRows },
    hdpe: { main: false, name: { th: 'HDPE PE100 PN10 (SDR17)', en: 'HDPE PE100 PN10 (SDR17)' }, short: { th: 'HDPE PN10', en: 'HDPE PN10' }, eps: { closed: 0.007, open: 0.007 }, rows: hdpeRows }
  };

  // ตัวประกอบสูญเสียของข้อต่อ/วาล์ว (K-method)
  const FITTINGS = [
    { key: 'elbow90', name: { th: 'ข้องอ 90°', en: 'Elbow 90°' }, K: 0.75 },
    { key: 'elbow45', name: { th: 'ข้องอ 45°', en: 'Elbow 45°' }, K: 0.35 },
    { key: 'teeRun', name: { th: 'ทีไหลตรง', en: 'Tee, through run' }, K: 0.4 },
    { key: 'teeBranch', name: { th: 'ทีแยกสาขา', en: 'Tee, branch' }, K: 1.0 },
    { key: 'gate', name: { th: 'Gate valve', en: 'Gate valve' }, K: 0.17 },
    { key: 'butterfly', name: { th: 'Butterfly valve', en: 'Butterfly valve' }, K: 0.6 },
    { key: 'check', name: { th: 'Check valve', en: 'Check valve' }, K: 2.0 },
    { key: 'strainer', name: { th: 'Y-strainer', en: 'Y-strainer' }, K: 3.0 }
  ];

  // Darcy friction factor (Colebrook-White)
  function fDarcy(Re, rel) {
    if (Re < 2300) return 64 / Re;
    let f = 0.25 / Math.pow(Math.log10(rel / 3.7 + 5.74 / Math.pow(Re, 0.9)), 2);
    for (let i = 0; i < 50; i++) {
      const x = -2 * Math.log10(rel / 3.7 + 2.51 / (Re * Math.sqrt(f)));
      const fn = 1 / (x * x);
      if (Math.abs(fn - f) < 1e-12) { f = fn; break; }
      f = fn;
    }
    return f;
  }

  function flowFromLoad({ mode, value, loop, dT, Tsup, heatFactor }) {
    const Tm = Tsup + dT / 2;
    const p = waterProps(Tm);
    let Q, kW;
    if (mode === 'TR' || mode === 'kW' || mode === 'BTUh') {
      const kWc = mode === 'TR' ? value * TR_KW : mode === 'BTUh' ? value * BTUH_KW : value;
      kW = loop === 'open' ? kWc * heatFactor : kWc;
      Q = kW / (p.cp * dT) / p.rho;
    } else {
      Q = mode === 'Ls' ? value / 1000 : mode === 'Lmin' ? value / 60000 : mode === 'm3h' ? value / 3600 : value * GPM_M3S;
      kW = Q * p.rho * p.cp * dT;
    }
    return { Q, kW, props: p, Tm };
  }

  function vmaxFor(dn, tiers) {
    for (const t of tiers) if (dn <= t.maxDN) return t.v;
    return tiers[tiers.length - 1].v;
  }

  function evaluateSizes(rows, Q, p, eps, crit) {
    return rows.map((row) => {
      const D = row.id / 1000;
      const A = Math.PI * D * D / 4;
      const v = Q / A;
      const Re = p.rho * v * D / p.mu;
      const f = fDarcy(Re, eps / row.id);
      const dp = f / D * p.rho * v * v / 2; // Pa/m
      const vmax = vmaxFor(row.tier ?? row.dn, crit.tiers);
      let status;
      if (v > vmax || dp > crit.fmax) status = 'over';
      else if (v < crit.vmin) status = 'low';
      else if (v > 0.9 * vmax || dp > 0.9 * crit.fmax) status = 'near';
      else status = 'ok';
      return { row, v, Re, f, dp, vmax, status };
    });
  }

  // เลือกขนาดที่เล็กที่สุดที่ผ่านเกณฑ์
  function recommend(res) {
    const hit = res.find((r) => r.status === 'ok' || r.status === 'near');
    if (hit) return { sel: hit, note: null };
    const low = res.find((r) => r.status === 'low');
    if (low) return { sel: low, note: 'lowflow' };
    return { sel: res[res.length - 1], note: 'toolarge' };
  }

  function pumpHead({ dpdl, L, sumK, v, rho, equipKPa, staticM, safety, eff, Q }) {
    const pipe = dpdl * L / 1000;
    const fit = sumK * rho * v * v / 2 / 1000;
    const stat = staticM * rho * G / 1000;
    const sub = pipe + fit + equipKPa + stat;
    const total = sub * (1 + safety / 100);
    return {
      pipe, fit, equip: equipKPa, stat, sub, total,
      head: total * 1000 / (rho * G),
      shaftKW: Q * total / eff
    };
  }

  return { waterProps, PIPES, FITTINGS, fDarcy, flowFromLoad, evaluateSizes, recommend, pumpHead, vmaxFor, TR_KW, BTUH_KW, GPM_M3S, G };
})();
if (typeof module !== 'undefined') module.exports = Core;

</script>

  // ---------- กราฟ friction ตามขนาดท่อ ----------
  function renderChart(res, sel, crit) {
    let rows = res.filter((r) => r.v >= 0.25 && r.v <= 5.5);
    if (rows.length < 2) rows = res.slice(Math.max(0, res.indexOf(sel) - 3), res.indexOf(sel) + 4);
    const W = 640, H = 270, ml = 56, mr = 16, mt = 14, mb = 48;
    const fmin = Math.max(crit.fmin, 1);
    const all = rows.map((r) => dFric(r.dp)).concat([dFric(crit.fmax), dFric(fmin)]);
    let lo = Math.floor(Math.log10(Math.min(...all))), hi = Math.ceil(Math.log10(Math.max(...all)));
    if (hi === lo) hi += 1;
    const y = (d) => mt + (H - mt - mb) * (1 - (Math.log10(dFric(d)) - lo) / (hi - lo));
    const x = (i) => ml + (W - ml - mr) * (rows.length === 1 ? 0.5 : i / (rows.length - 1));
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('กราฟ friction loss เทียบขนาดท่อ', 'Friction loss against pipe size')}">`;
    for (let k = lo; k <= hi; k++) {
      const v = Math.pow(10, k), yy = mt + (H - mt - mb) * (1 - (k - lo) / (hi - lo));
      s += `<line class="g-line" x1="${ml}" x2="${W - mr}" y1="${yy}" y2="${yy}"/><text class="g-t" x="${ml - 8}" y="${yy + 4}" text-anchor="end">${v >= 1000 ? v / 1000 + 'k' : +v.toPrecision(3)}</text>`;
    }
    s += `<text class="g-t" x="${ml - 8}" y="${mt - 3}" text-anchor="end">${uFric()}</text>`;
    if (fmin < crit.fmax) s += `<rect class="g-band" x="${ml}" y="${y(crit.fmax)}" width="${W - ml - mr}" height="${y(fmin) - y(crit.fmax)}"/>`;
    s += `<line class="g-lim" x1="${ml}" x2="${W - mr}" y1="${y(crit.fmax)}" y2="${y(crit.fmax)}"/>`;
    s += `<text class="g-t bad" x="${W - mr}" y="${y(crit.fmax) - 5}" text-anchor="end">${L('สูงสุด', 'max')} ${fFric(crit.fmax)}</text>`;
    s += `<polyline class="g-path" points="${rows.map((r, i) => `${x(i)},${y(r.dp)}`).join(' ')}"/>`;
    rows.forEach((r, i) => {
      s += `<circle class="s-${r.status}" cx="${x(i)}" cy="${y(r.dp)}" r="4.5"/>`;
      if (r === sel) s += `<circle class="g-ring" cx="${x(i)}" cy="${y(r.dp)}" r="9"/>`;
      s += `<text class="g-t${r === sel ? ' b' : ''}" x="${x(i)}" y="${H - 28}" text-anchor="middle">${r.row.label}</text>`;
      s += `<text class="g-t${r.v > r.vmax ? ' bad' : ''}" x="${x(i)}" y="${H - 14}" text-anchor="middle">${fmt(dVel(r.v), 1)}</text>`;
    });
    s += `<text class="g-t" x="${ml - 8}" y="${H - 14}" text-anchor="end">${uVel()}</text></svg>`;
    $('chart').innerHTML = s;
  }

  // ---------- กราฟ Friction Loss – Water Flow ----------
  function renderFlowChart(c) {
    const { pipe, eps, props, crit, sel, Q } = c;
    const IP = ip();
    const W = 860, H = 560, ml = 66, mr = 74, mt = 18, mb = 54;
    const xlo = IP ? 0 : -1, xhi = IP ? 4 : 3, ylo = IP ? -2 : 0, yhi = IP ? 2 : 4;
    const dQ = (q) => (IP ? q / Core.GPM_M3S : q * 1000);
    const lx = (q) => Math.log10(dQ(q)), ly = (dp) => Math.log10(dFric(dp));
    const X = (q) => ml + (W - ml - mr) * ((lx(q) - xlo) / (xhi - xlo));
    const Y = (dp) => mt + (H - mt - mb) * (1 - (ly(dp) - ylo) / (yhi - ylo));
    const inR = (q, dp) => lx(q) >= xlo && lx(q) <= xhi && ly(dp) >= ylo && ly(dp) <= yhi;
    const dpOf = (row, v) => {
      const D = row.id / 1000, Re = props.rho * v * D / props.mu, f = Core.fDarcy(Re, eps / row.id);
      return f / D * props.rho * v * v / 2;
    };
    const areaOf = (row) => Math.PI * Math.pow(row.id / 1000, 2) / 4;
    const tick = (v) => (v >= 1000 ? (v / 1000) + 'k' : +v.toPrecision(3));
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Friction loss - water flow chart">`;
    // grid
    for (let k = xlo; k <= xhi; k++) {
      for (const m of [1, 2, 3, 5]) {
        if (k === xhi && m > 1) continue;
        const xx = ml + (W - ml - mr) * ((k + Math.log10(m) - xlo) / (xhi - xlo));
        s += `<line class="${m === 1 ? 'g-line' : 'g-minor'}" x1="${xx}" x2="${xx}" y1="${mt}" y2="${H - mb}"/>`;
        if (m === 1) s += `<text class="g-t" x="${xx}" y="${H - mb + 16}" text-anchor="middle">${tick(Math.pow(10, k))}</text>`;
      }
    }
    for (let k = ylo; k <= yhi; k++) {
      for (const m of [1, 2, 3, 5]) {
        if (k === yhi && m > 1) continue;
        const yy = mt + (H - mt - mb) * (1 - ((k + Math.log10(m) - ylo) / (yhi - ylo)));
        s += `<line class="${m === 1 ? 'g-line' : 'g-minor'}" x1="${ml}" x2="${W - mr}" y1="${yy}" y2="${yy}"/>`;
        if (m === 1) s += `<text class="g-t" x="${ml - 8}" y="${yy + 4}" text-anchor="end">${tick(Math.pow(10, k))}</text>`;
      }
    }
    // recommended band and limit
    const fmin = Math.max(crit.fmin, 1e-6);
    const yMax = Y(crit.fmax), yMin = Y(fmin);
    if (fmin < crit.fmax && yMax < H - mb && yMin > mt) s += `<rect class="g-band" x="${ml}" y="${Math.max(yMax, mt)}" width="${W - ml - mr}" height="${Math.min(yMin, H - mb) - Math.max(yMax, mt)}"/>`;
    if (yMax > mt && yMax < H - mb) {
      s += `<line class="g-lim" x1="${ml}" x2="${W - mr}" y1="${yMax}" y2="${yMax}"/>`;
      s += `<text class="g-t bad" x="${W - mr - 4}" y="${yMax - 5}" text-anchor="end">${L('ΔP สูงสุด', 'max ΔP')} ${fFric(crit.fmax)} ${uFric()}</text>`;
    }
    // velocity lines
    const vl = (IP ? [2, 4, 6, 8, 10, 15] : [0.6, 1.2, 1.8, 2.4, 3.0, 4.5]).map((v) => ({ v: IP ? v * 0.3048 : v, lbl: v }));
    vl.forEach((o) => {
      const pts = pipe.rows.map((r) => [areaOf(r) * o.v, dpOf(r, o.v)]).filter((p) => inR(p[0], p[1]));
      if (pts.length < 2) return;
      s += `<polyline class="g-vel" points="${pts.map((p) => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ')}"/>`;
      const e = pts[pts.length - 1];
      s += `<text class="g-t vel" x="${Math.min(X(e[0]) + 4, W - mr + 2)}" y="${Y(e[1]) - 4}">${o.lbl} ${uVel()}</text>`;
    });
    // pipe curves
    const showInch = IP && pipe.rows[0].alt.indexOf('"') >= 0;
    pipe.rows.forEach((r) => {
      const A = areaOf(r), pts = [];
      for (let i = 0; i <= 28; i++) {
        const v = 0.3 * Math.pow(5 / 0.3, i / 28);
        const q = A * v, dp = dpOf(r, v);
        if (inR(q, dp)) pts.push([q, dp]);
      }
      if (pts.length < 2) return;
      const isSel = sel && r === sel.row;
      s += `<polyline class="g-pipe${isSel ? ' sel' : ''}" points="${pts.map((p) => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ')}"/>`;
      const e = pts[pts.length - 1];
      s += `<text class="g-t${isSel ? ' acc' : ' b'}" x="${X(e[0]) + 3}" y="${Y(e[1]) - 5}">${showInch ? r.alt : r.label}</text>`;
    });
    // design point
    if (sel && inR(Q, sel.dp)) {
      s += `<line class="g-cross" x1="${X(Q)}" x2="${X(Q)}" y1="${Y(sel.dp)}" y2="${H - mb}"/><line class="g-cross" x1="${ml}" x2="${X(Q)}" y1="${Y(sel.dp)}" y2="${Y(sel.dp)}"/>`;
      s += `<circle class="g-dot" cx="${X(Q)}" cy="${Y(sel.dp)}" r="5"/><circle class="g-ring" cx="${X(Q)}" cy="${Y(sel.dp)}" r="10"/>`;
      const right = X(Q) < W - mr - 190;
      s += `<text class="g-t acc" x="${X(Q) + (right ? 14 : -14)}" y="${Y(sel.dp) + 18}" text-anchor="${right ? 'start' : 'end'}">${L('จุดออกแบบ', 'Design point')}: ${fmt(IP ? Q / Core.GPM_M3S : Q * 1000, IP ? 0 : 1)} ${IP ? 'gpm' : 'L/s'}, ${fFric(sel.dp)} ${uFric()}</text>`;
    }
    s += `<text class="g-t ttl" x="${(ml + W - mr) / 2}" y="${H - 8}" text-anchor="middle">${L('อัตราไหล', 'Flow')} (${IP ? 'US gpm' : 'L/s'})</text>`;
    s += `<text class="g-t ttl" transform="translate(16 ${(mt + H - mb) / 2}) rotate(-90)" text-anchor="middle">Friction loss (${uFric()})</text></svg>`;
    $('flowSvg').innerHTML = s; applyVB();
    $('flowHint').textContent = L(
      `${pipe.name.th} · ε ${fmt(IP ? eps / 25.4 : eps, IP ? 5 : 4)} ${IP ? 'in' : 'มม.'} · น้ำที่ ${fmt(c.Tm, 1)} °C · เส้นทึบคือขนาดท่อ เส้นประส้มคือความเร็วคงที่ แถบสีคือช่วง friction ที่แนะนำ`,
      `${pipe.name.en} · ε ${fmt(IP ? eps / 25.4 : eps, IP ? 5 : 4)} ${IP ? 'in' : 'mm'} · water at ${fmt(c.Tm, 1)} °C · solid lines are pipe sizes, orange dashes are constant velocity, shaded band is the recommended friction range`);
  }

  const STATUS = () => ({ ok: L('เหมาะสม', 'Suitable'), near: L('ใกล้เกณฑ์', 'Near limit'), over: L('เล็กเกินไป', 'Too small'), low: L('ใหญ่เกินไป', 'Too large') });

  function update() {
    refreshUnits();
    const loop = state.loop, mat = $('mat').value;
    const known = state.known, unit = state.unit;
    const val = num('val'), tin = getSI('tin'), tout = getSI('tout'), eps = getSI('eps');
    const dt = tout - tin;
    const hf = loop === 'open' && known === 'cap' ? num('hf') : 1;
    $('dtro').innerHTML = isFinite(dt)
      ? `ΔT = <b>${fmt(dt, 2)} K</b> (${fmt(dt * 1.8, 2)} °F) · ${L('T เฉลี่ย', 'mean T')} ${fmt((tin + tout) / 2, 1)} °C`
      : '';
    $('hfWrap').hidden = !(loop === 'open' && known === 'cap');

    const crit = {
      vmin: getSI('vmin'), fmax: getSI('fmax'), fmin: getSI('fmin'),
      tiers: [{ maxDN: 50, v: getSI('v1') }, { maxDN: 100, v: getSI('v2') }, { maxDN: 200, v: getSI('v3') }, { maxDN: 1e9, v: getSI('v4') }]
    };
    const bad = !(val > 0) || !(dt > 0) || !isFinite(tin) || !(eps > 0) || !(hf >= 1) ||
      [crit.vmin, crit.fmax, crit.fmin, ...crit.tiers.map((t) => t.v)].some((v) => !isFinite(v));
    if (bad) {
      $('summary').innerHTML = `<div class="block empty">${isFinite(dt) && dt <= 0
        ? L('อุณหภูมิน้ำออกต้องสูงกว่าน้ำเข้า', 'Leaving temperature must be higher than entering temperature')
        : L('กรอกค่าให้ครบและมากกว่าศูนย์เพื่อเริ่มคำนวณ', 'Fill in all fields with values above zero to calculate')}</div>`;
      ['tbl', 'cmp', 'pumpOut', 'chart', 'flowSvg', 'dock'].forEach((id) => { $(id).innerHTML = ''; });
      return;
    }

    const fl = Core.flowFromLoad({ mode: unit, value: val, loop, dT: dt, Tsup: tin, heatFactor: hf });
    const pipe = Core.PIPES[mat];
    const res = Core.evaluateSizes(pipe.rows, fl.Q, fl.props, eps, crit);
    const { sel, note } = Core.recommend(res);
    const next = res[res.indexOf(sel) + 1];
    const coolKW = known === 'cap' ? (unit === 'TR' ? val * Core.TR_KW : unit === 'BTUh' ? val * Core.BTUH_KW : val) : (loop === 'open' ? fl.kW / (num('hf') || 1) : fl.kW);
    state.last = { Q: fl.Q, coolKW };
    const IP = ip();

    // --- สรุป ---
    const Qs = fl.Q * 1000, Qh = fl.Q * 3600, Qg = fl.Q / Core.GPM_M3S;
    const flowBig = IP ? `${fmt(Qg, dg(Qg))}<i>US gpm</i>` : `${fmt(Qs, dg(Qs))}<i>L/s</i>`;
    const flowSub = IP ? `${fmt(Qs, dg(Qs))} L/s · ${fmt(Qh, dg(Qh))} m³/h` : `${fmt(Qg, dg(Qg))} US gpm · ${fmt(Qh, dg(Qh))} m³/h`;
    const perTR = fmt(Qg / (fl.kW / (loop === 'open' ? 1 : 1) / Core.TR_KW), 2);
    const heatLine = loop === 'open'
      ? L(`ความร้อนที่ระบาย ${fmt(fl.kW, dk(fl.kW))} kW (${fmt(fl.kW / Core.TR_KW, 0)} TR)`, `Heat rejection ${fmt(fl.kW, dk(fl.kW))} kW (${fmt(fl.kW / Core.TR_KW, 0)} TR)`)
      : L(`โหลด ${fmt(fl.kW, dk(fl.kW))} kW`, `Load ${fmt(fl.kW, dk(fl.kW))} kW`);
    const capLine = `${fmt(coolKW / Core.TR_KW, 1)} TR · ${fmt(coolKW, dk(coolKW))} kW · ${fmt(coolKW / Core.BTUH_KW, 0)} BTU/h`;
    const mdot = fl.Q * fl.props.rho;
    const formula = known === 'cap'
      ? `${fmt(fl.kW, dk(fl.kW))} kW ÷ (${fmt(fl.props.cp, 3)} kJ/kg·K × ${fmt(dt, 2)} K) = ${fmt(mdot, dg(mdot))} kg/s ÷ ${fmt(fl.props.rho, 1)} kg/m³`
      : L('ใช้อัตราไหลที่ระบุ ไม่ต้องคำนวณจากโหลด', 'Flow entered directly, no load calculation');
    const qpt = fl.kW > 0 ? `${fmt(Qg / (coolKW / Core.TR_KW), 2)} gpm/TR · ${fmt(Qs / (coolKW / Core.TR_KW), 3)} L/s·TR` : '';
    let alert = '';
    if (note === 'lowflow') alert = `<div class="alert">${L(`อัตราไหลต่ำมาก ขนาดเล็กกว่านี้ความเร็วเกินเกณฑ์ ขนาดนี้เป็นขนาดที่ใกล้เคียงที่สุดแต่ความเร็วต่ำกว่า ${fmt(dVel(crit.vmin), 2)} ${uVel()}`, `Very low flow. Smaller sizes exceed the limits, so this is the closest size, but velocity is below ${fmt(dVel(crit.vmin), 2)} ${uVel()}`)}</div>`;
    if (note === 'toolarge') alert = `<div class="alert bad">${L('อัตราไหลเกินความสามารถของท่อขนาดใหญ่สุดของชนิดนี้ที่เกณฑ์ปัจจุบัน ควรแยกเป็นท่อขนานหลายเส้น หรือเลือกชนิดท่ออื่น', 'Flow exceeds the largest size of this pipe type at the current criteria. Use parallel pipes or choose another pipe type.')}</div>`;
    const idTxt = IP ? `${fmt(sel.row.id / 25.4, 2)} in` : `${fmt(sel.row.id, 1)} mm`;
    const rho = IP ? `${fmt(fl.props.rho * 0.062428, 2)} lb/ft³` : `${fmt(fl.props.rho, 1)} kg/m³`;
    const cpTxt = IP ? `${fmt(fl.props.cp * 0.238846, 3)} Btu/lb·°F` : `${fmt(fl.props.cp, 3)} kJ/kg·K`;
    $('summary').innerHTML = `
      <div class="kpis">
        <div class="kpi"><span class="lbl">${L('ปริมาณน้ำที่ต้องใช้', 'Required water flow')}</span>
          <b class="big">${flowBig}</b>
          <span class="sm">${flowSub}</span>
          <span class="sm m">${known === 'cap' ? capLine : ''}</span>
          <span class="sm m">${heatLine} · ${qpt}</span>
          <span class="sm m">${formula}</span></div>
        <div class="kpi rec"><span class="lbl">${L('ขนาดท่อที่แนะนำ (เล็กที่สุดที่ผ่านเกณฑ์)', 'Recommended size (smallest that passes)')}</span>
          <b class="big">${sel.row.label}<i>${sel.row.alt}</i></b>
          <span class="sm">ID ${idTxt} · v ${fmt(dVel(sel.v))} ${uVel()}</span>
          <span class="sm">${fFric(sel.dp)} ${uFric()} · ${fFricAlt(sel.dp)} ${uFricAlt()}</span>
          <span class="sm m">${next ? L(`ใหญ่ขึ้น 1 ขนาด ${next.row.label}: v ${fmt(dVel(next.v))} ${uVel()} · ${fFric(next.dp)} ${uFric()}`, `One size up ${next.row.label}: v ${fmt(dVel(next.v))} ${uVel()} · ${fFric(next.dp)} ${uFric()}`) : ''}</span></div>
        <div class="kpi"><span class="lbl">${L('คุณสมบัติน้ำที่', 'Water properties at')} ${fmt(IP ? fl.Tm * 1.8 + 32 : fl.Tm, 1)} ${IP ? '°F' : '°C'}</span>
          <span class="sm">ρ ${rho}</span>
          <span class="sm">μ ${fmt(fl.props.mu * 1000, 3)} ${IP ? 'cP' : 'mPa·s'}</span>
          <span class="sm">cp ${cpTxt}</span></div>
      </div>${alert}`;

    $('dock').innerHTML = `<div><span>${L('ปริมาณน้ำ', 'Flow')}</span><b>${IP ? fmt(Qg, dg(Qg)) + ' gpm' : fmt(Qs, dg(Qs)) + ' L/s'}</b></div>` +
      `<div><span>${L('ท่อแนะนำ', 'Pipe')}</span><b>${sel.row.label}</b></div>` +
      `<div><span>v · ΔP</span><b>${fmt(dVel(sel.v), 1)} ${uVel()} · ${fFric(sel.dp)}</b></div>` +
      `<div class="go"><b aria-hidden="true">↓</b><span>${L('ตารางขนาดท่อ', 'Size table')}</span></div>`;

    // --- ตารางขนาดท่อ ---
    const shown = res.filter((r) => state.showAll || (r.v >= 0.2 && r.v <= 5.5) || r === sel);
    const ST = STATUS();
    $('tblHint').textContent = `${pipe.name[state.lang]} · ε ${fmt(IP ? eps / 25.4 : eps, IP ? 5 : 4)} ${IP ? 'in' : 'mm'} · ${L('ΔP สูงสุด', 'max ΔP')} ${fFric(crit.fmax)} ${uFric()} · ${L('v ต่ำสุด', 'min v')} ${fmt(dVel(crit.vmin), 2)} ${uVel()}`;
    $('tbl').innerHTML = `<thead><tr><th>${L('ขนาด', 'Size')}</th><th>ID (${IP ? 'in' : 'mm'})</th><th>v (${uVel()})</th><th>ΔP (${uFric()})</th><th>ΔP (${uFricAlt()})</th><th>Re</th><th>${L('สถานะ', 'Status')}</th></tr></thead><tbody>` +
      shown.map((r) => {
        const vC = r.v > r.vmax ? 'bad' : r.v < crit.vmin ? 'warn' : '';
        const dC = r.dp > crit.fmax ? 'bad' : '';
        return `<tr class="${r === sel ? 'rec' : ''}"><td>${r.row.label} <span style="color:var(--muted)">${r.row.alt}</span></td><td>${IP ? fmt(r.row.id / 25.4, 2) : fmt(r.row.id, 1)}</td>` +
          `<td class="${vC}">${fmt(dVel(r.v))}</td><td class="${dC}">${fFric(r.dp)}</td><td class="dim">${fFricAlt(r.dp)}</td>` +
          `<td>${(r.Re / 1000).toFixed(0)}k</td><td><span class="pill ${r.status}">${ST[r.status]}</span>${r === sel ? ' ◀' : ''}</td></tr>`;
      }).join('') + '</tbody>';

    renderChart(res, sel, crit);

    // --- เทียบชนิดท่อ ---
    $('cmp').innerHTML = `<thead><tr><th>${L('ชนิดท่อ', 'Pipe type')}</th><th>${L('ขนาดแนะนำ', 'Size')}</th><th>ID (${IP ? 'in' : 'mm'})</th><th>v (${uVel()})</th><th>ΔP (${uFric()})</th><th>ε (${IP ? 'in' : 'mm'})</th></tr></thead><tbody>` +
      Object.entries(Core.PIPES).map(([k, p]) => {
        const e = p.eps[loop];
        const r = Core.recommend(Core.evaluateSizes(p.rows, fl.Q, fl.props, e, crit));
        const s = r.sel;
        const warn = r.note === 'toolarge' ? ` <span class="pill over">${L('เกินตาราง', 'Out of range')}</span>` : r.note === 'lowflow' ? ` <span class="pill near">${L('v ต่ำ', 'Low v')}</span>` : '';
        return `<tr class="${k === mat ? 'cur' : ''}"><td>${p.short[state.lang]}</td><td>${s.row.label}${warn}</td><td>${IP ? fmt(s.row.id / 25.4, 2) : fmt(s.row.id, 1)}</td><td>${fmt(dVel(s.v))}</td><td>${fFric(s.dp)}</td><td>${IP ? fmt(e / 25.4, 5) : e}</td></tr>`;
      }).join('') + '</tbody>';

    // --- Pump head ---
    const sumK = Core.FITTINGS.reduce((a, f) => a + f.K * (num('k_' + f.key) || 0), 0);
    const equip = ['eq1', 'eq2', 'eq3'].reduce((a, id) => a + (getSI(id) || 0), 0);
    const Lm = getSI('L') || 0;
    const ph = Core.pumpHead({
      dpdl: sel.dp, L: Lm, sumK, v: sel.v, rho: fl.props.rho, equipKPa: equip,
      staticM: loop === 'open' ? (getSI('stat') || 0) : 0, safety: num('safety') || 0,
      eff: Math.min(Math.max((num('eff') || 70) / 100, 0.3), 0.95), Q: fl.Q
    });
    $('pumpHint').textContent = loop === 'open'
      ? L(`คำนวณกับท่อขนาด ${sel.row.label} · รวมความสูงยกน้ำและหัวฉีดหอผึ่งเย็น`, `Based on ${sel.row.label} pipe · includes static lift and tower spray nozzles`)
      : L(`คำนวณกับท่อขนาด ${sel.row.label} · ระบบปิดไม่นับแรงดันสถิต`, `Based on ${sel.row.label} pipe · closed system, static head not counted`);
    const P = (kpa) => (IP ? kpa * 0.145038 : kpa), uP = IP ? 'psi' : 'kPa';
    const parts = [
      ['c1', L('ท่อตรง', 'Straight pipe'), ph.pipe], ['c2', L('ข้อต่อ/วาล์ว', 'Fittings/valves'), ph.fit], ['c3', L('อุปกรณ์', 'Equipment'), ph.equip],
      ['c4', L('ความสูงยกน้ำ', 'Static lift'), ph.stat], ['c5', 'Safety', ph.total - ph.sub]
    ].filter((p) => p[2] > 0.0001);
    $('pumpOut').innerHTML = `
      <div class="phead">
        <div><span class="lbl">${L('แรงดันรวมที่ปั๊มต้องสร้าง', 'Total pump pressure')}</span><b class="big">${fmt(P(ph.total), IP ? 1 : 0)}<i>${uP}</i></b></div>
        <div><span class="lbl">Pump head</span><b class="big">${fmt(IP ? ph.head / 0.3048 : ph.head, 1)}<i>${IP ? 'ft' : 'm'}</i></b></div>
        <div><span class="lbl">${L('กำลังเพลาโดยประมาณ', 'Approx. shaft power')}</span><b class="big">${fmt(IP ? ph.shaftKW * 1.34102 : ph.shaftKW, 1)}<i>${IP ? 'hp' : 'kW'}</i></b></div>
      </div>
      <div class="stack" role="img" aria-label="${L('สัดส่วนแรงดันสูญเสีย', 'Pressure loss share')}">${parts.map((p) => `<span class="${p[0]}" style="width:${(p[2] / ph.total * 100).toFixed(2)}%"></span>`).join('')}</div>
      <div class="legend">${parts.map((p) => `<span><i class="${p[0]}"></i>${p[1]} ${fmt(P(p[2]), 1)} ${uP}</span>`).join('')}</div>
      <p class="mini">ΣK = ${fmt(sumK, 2)} · ${fFric(sel.dp)} ${uFric()} × ${fmt(IP ? Lm / 0.3048 : Lm, 0)} ${IP ? 'ft' : 'm'}</p>`;

    // --- กราฟอ้างอิง ---
    renderFlowChart({ pipe, eps, props: fl.props, crit, sel, Q: fl.Q, Tm: fl.Tm });

    state.text = [
      `Pipe Calculator: ${loop === 'closed' ? 'Closed loop (CHW)' : 'Open loop (CW)'}`,
      `${L('อัตราไหล', 'Flow')} ${fmt(Qg, dg(Qg))} US gpm = ${fmt(Qs, dg(Qs))} L/s = ${fmt(Qh, dg(Qh))} m³/h (ΔT ${fmt(dt, 2)} K, ${fmt(tin, 1)} → ${fmt(tout, 1)} °C)`,
      `${pipe.name[state.lang]}, ε ${fmt(eps, 4)} mm`,
      `${L('ขนาดแนะนำ', 'Recommended')} ${sel.row.label} (${sel.row.alt}), ID ${fmt(sel.row.id, 1)} mm, v ${fmt(sel.v)} m/s (${fmt(sel.v / 0.3048)} ft/s), ΔP ${fmt(sel.dp, 0)} Pa/m (${fmt(sel.dp / 98.06, 2)} ft/100ft)`
    ].join('\n');
  }

  // ---------- ซูม/เลื่อนกราฟอ้างอิง ----------
  const FW = 860, FH = 560, vb = { x: 0, y: 0, w: FW, h: FH };
  const zwrap = $('flowWrap');
  function applyVB() {
    const svg = zwrap.querySelector('svg');
    if (svg) svg.setAttribute('viewBox', `${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`);
    zwrap.classList.toggle('zoomed', vb.w < FW - 0.5);
    $('zLvl').textContent = vb.w < FW - 0.5 ? `${fmt(FW / vb.w, 1)}×` : '';
  }
  function clampVB() {
    vb.w = Math.min(FW, Math.max(FW / 10, vb.w)); vb.h = vb.w * FH / FW;
    vb.x = Math.min(Math.max(0, vb.x), FW - vb.w); vb.y = Math.min(Math.max(0, vb.y), FH - vb.h);
  }
  function zoomAt(f, fx, fy) {
    const px = vb.x + vb.w * fx, py = vb.y + vb.h * fy;
    vb.w = vb.w / f; vb.h = vb.w * FH / FW;
    vb.x = px - vb.w * fx; vb.y = py - vb.h * fy;
    clampVB(); applyVB();
  }
  function resetZoom() { vb.x = 0; vb.y = 0; vb.w = FW; vb.h = FH; applyVB(); }
  const frac = (cx, cy) => {
    const r = zwrap.querySelector('svg').getBoundingClientRect();
    return [Math.min(1, Math.max(0, (cx - r.left) / (r.width || 1))), Math.min(1, Math.max(0, (cy - r.top) / (r.height || 1))), r];
  };
  $('zIn').addEventListener('click', () => zoomAt(1.5, 0.5, 0.5));
  $('zOut').addEventListener('click', () => zoomAt(1 / 1.5, 0.5, 0.5));
  $('zReset').addEventListener('click', resetZoom);
  zwrap.addEventListener('wheel', (e) => {
    if (!(e.ctrlKey || e.metaKey) || !zwrap.querySelector('svg')) return;
    e.preventDefault();
    const [fx, fy] = frac(e.clientX, e.clientY);
    zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, fx, fy);
  }, { passive: false });
  zwrap.addEventListener('dblclick', (e) => {
    if (e.target.closest('.zoomctl') || !zwrap.querySelector('svg')) return;
    const [fx, fy] = frac(e.clientX, e.clientY); zoomAt(2, fx, fy);
  });
  const ptrs = new Map();
  zwrap.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.zoomctl')) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { zwrap.setPointerCapture(e.pointerId); } catch (err) {}
  });
  zwrap.addEventListener('pointermove', (e) => {
    const prev = ptrs.get(e.pointerId); if (!prev || !zwrap.querySelector('svg')) return;
    const cur = { x: e.clientX, y: e.clientY };
    const r = zwrap.querySelector('svg').getBoundingClientRect();
    if (ptrs.size === 1) {
      if (vb.w < FW) { vb.x -= (cur.x - prev.x) * vb.w / r.width; vb.y -= (cur.y - prev.y) * vb.h / r.height; clampVB(); applyVB(); }
    } else if (ptrs.size === 2) {
      const other = [...ptrs.entries()].find((p) => p[0] !== e.pointerId)[1];
      const d0 = Math.hypot(prev.x - other.x, prev.y - other.y), d1 = Math.hypot(cur.x - other.x, cur.y - other.y);
      if (d0 > 0) { const [fx, fy] = frac((cur.x + other.x) / 2, (cur.y + other.y) / 2); zoomAt(d1 / d0, fx, fy); }
    }
    ptrs.set(e.pointerId, cur);
  });
  ['pointerup', 'pointercancel'].forEach((n) => zwrap.addEventListener(n, (e) => { ptrs.delete(e.pointerId); }));

  // ---------- events ----------
  document.querySelectorAll('#loopTabs button').forEach((b) => b.addEventListener('click', () => applyLoop(b.dataset.loop)));
  document.querySelectorAll('#langSeg button').forEach((b) => b.addEventListener('click', () => {
    state.lang = b.dataset.lang; try { localStorage.setItem('cps.lang', state.lang); } catch (e) {}
    setLoopTabs(); refreshOptions(); update();
  }));
  document.querySelectorAll('#sysSeg button').forEach((b) => b.addEventListener('click', () => {
    const to = b.dataset.sys; if (to === state.sys) return;
    const from = state.sys;
    Object.entries(FIELDS).forEach(([id, kind]) => {
      const v = parseFloat($(id).value);
      if (isFinite(v)) $(id).value = String(convertDisplay(kind, v, from, to));
    });
    state.sys = to; try { localStorage.setItem('cps.sys', to); } catch (e) {}
    setLoopTabs(); resetZoom(); update();
  }));
  $('mat').addEventListener('change', () => { setSI('eps', Core.PIPES[$('mat').value].eps[state.loop]); update(); });
  $('known').addEventListener('click', (e) => {
    const bt = e.target.closest('button'); if (!bt || bt.dataset.v === state.known) return;
    state.known = bt.dataset.v;
    state.unit = state.known === 'cap' ? 'TR' : 'gpm';
    if (state.last) {
      const v = state.known === 'cap' ? state.last.coolKW / CAPBASE[state.unit] : state.last.Q / FLOWBASE[state.unit];
      $('val').value = String(+v.toPrecision(6));
    }
    refreshOptions(); update();
  });
  $('unit').addEventListener('click', (e) => {
    const bt = e.target.closest('button'); if (!bt || bt.dataset.v === state.unit) return;
    const nu = bt.dataset.v, ou = state.unit, v = parseFloat($('val').value);
    const base = state.known === 'cap' ? CAPBASE : FLOWBASE;
    // แปลงจากค่าจริงที่คำนวณล่าสุด เพื่อไม่ให้ค่าคลาดจากการปัดซ้ำ
    if (state.last) $('val').value = String(+((state.known === 'cap' ? state.last.coolKW : state.last.Q) / base[nu]).toPrecision(6));
    else if (isFinite(v)) $('val').value = String(+(v * base[ou] / base[nu]).toPrecision(6));
    state.unit = nu; refreshOptions(); update();
  });
  const gotoTable = () => {
    const el = $('sizeBlock');
    const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
  };
  $('dock').addEventListener('click', gotoTable);
  $('dock').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); gotoTable(); } });
  $('showAll').addEventListener('change', (e) => { state.showAll = e.target.checked; update(); });
  document.querySelectorAll('input[type=number]').forEach((i) => i.addEventListener('input', update));
  $('copyBtn').addEventListener('click', async () => {
    const b = $('copyBtn');
    try { await navigator.clipboard.writeText(state.text || ''); b.textContent = L('คัดลอกแล้ว', 'Copied'); }
    catch (e) { b.textContent = L('คัดลอกไม่ได้ ลองเลือกข้อความเอง', 'Copy failed, select the text manually'); }
    setTimeout(() => { b.textContent = L('คัดลอกสรุปผล', 'Copy summary'); }, 1800);
  });

  // ค่าเริ่มต้นของเกณฑ์
  setSI('v1', 1.2); setSI('v2', 1.8); setSI('v3', 2.4); setSI('v4', 3.0); setSI('fmax', 400); setSI('fmin', 100);
  $('mat').innerHTML = '<option value="steel40"></option>';
  applyLoop('closed', true);
  setLoopTabs();
  update();
})();
</script>

<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
